# Configuracao de acesso ao banco.
# Deixe ATIVO apenas um dos blocos abaixo.

# --- Opcao 1: H2 embutido (padrao; nao precisa instalar nada) ---
# Cria o arquivo data/catalogo.mv.db e a tabela automaticamente (schema-h2.sql).
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/catalogo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema-h2.sql'
db.user=sa
db.password=

